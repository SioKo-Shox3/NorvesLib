name: Texture asset-set legacy baseline

on:
  push:
    branches: [feature/game-asset-import]
    paths:
      - '.github/workflows/texture-asset-set-baseline.yml'
      - 'Scripts/CaptureTextureAssetSetBaseline.py'
      - 'Test/Tools/TextureAssetSetBaselineTest.py'
      - 'Docs/AssetCookTextureLegacyRecipe.json'

permissions:
  contents: read
  actions: read

jobs:
  capture-legacy:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: 比較元mainをcommit固定で別ディレクトリへ取得する
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: b8c5df1dbf9c76d2cfcb36d1f82a889293969dde
          path: legacy-upstream
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            Scripts
            Assets/AssetSets
            Assets/Textures/Silver
            Assets/Models/Rendering3DTestSilverGltf/textures
      - name: 固定した分割前実行ファイルを取得する
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: '11302304928'
          run-id: '37200047966'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/NorvesCliFrozenBefore
      - name: 採取器の拒否契約を検証する
        run: |
          python -B Test/Tools/TextureAssetSetBaselineTest.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Capture contract tests failed' }
          python -B -O Test/Tools/TextureAssetSetBaselineTest.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Optimized capture contract tests failed' }
      - name: 固定旧PS1で2specを独立2回cookする
        id: capture
        run: |
          python -B Scripts/CaptureTextureAssetSetBaseline.py --source legacy-upstream --exe "$env:RUNNER_TEMP/NorvesCliFrozenBefore/AssetCook.exe" --recipe Docs/AssetCookTextureLegacyRecipe.json --output "$env:RUNNER_TEMP/NorvesTextureLegacy" 2>&1 | Tee-Object "$env:RUNNER_TEMP/texture-legacy-capture.log"
          if ($LASTEXITCODE -ne 0) { throw 'Actual legacy texture capture failed' }
      - name: 成功した生byte基準を保存する
        if: steps.capture.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: texture-legacy-baseline-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/NorvesTextureLegacy/snapshot/
      - name: 実行ログを保存する
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: texture-legacy-logs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/texture-legacy-capture.log
            ${{ runner.temp }}/NorvesTextureLegacy/logs/
            ${{ runner.temp }}/NorvesTextureLegacy/invoke.ps1
